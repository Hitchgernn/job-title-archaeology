[project]
name = "job-title-archaeology"
version = "0.1.0"
description = "Hackathon web intelligence tool for emerging job title detection"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115.0", "google-genai>=1.0.0", "httpx>=0.27.0", "psycopg[binary]>=3.2.0", "pydantic>=2.8.0", "pydantic-settings>=2.4.0", "pyyaml>=6.0.2", "typer>=0.12.0", "uvicorn>=0.30.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "respx>=0.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
